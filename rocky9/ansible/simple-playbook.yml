---
# Simple playbook for testing SSH connectivity
- name: Basic Rocky 9 configuration
  hosts: default
  become: yes
  gather_facts: yes
  tasks:
    - name: Wait for system to become reachable
      wait_for_connection:
        timeout: 300

    - name: Gather facts after connection is established
      setup:

    - name: Create test directory
      file:
        path: /opt/test
        state: directory
        mode: '0755'

    - name: Create hello world file
      copy:
        content: "Hello World from Ansible!\nThis file was created during the image build process.\n"
        dest: /opt/test/hello.txt
        mode: '0644'

    - name: Install vim package
      dnf:
        name: vim
        state: present
        update_cache: yes
      register: dnf_result
      retries: 3
      delay: 5
      until: dnf_result is success

    - name: Create a marker file to indicate Ansible ran successfully
      copy:
        content: "Ansible playbook completed successfully at {{ ansible_date_time.iso8601 }}\n"
        dest: /opt/test/ansible_success.txt
        mode: '0644'
